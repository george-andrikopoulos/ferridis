[package]
name = "ferridis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sidecar binary that exposes ferridis-client over JSON-RPC 2.0 on stdin/stdout. Bridges TypeScript / non-Rust editor hosts to the Rust consumer-side library."

[[bin]]
name = "ferridis-cli"
path = "src/main.rs"

[dependencies]
ferridis-core = { workspace = true }
ferridis-protocol = { workspace = true }
ferridis-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
ferridis-adapter-sdk = { workspace = true }
ferridis-adapter-fs = { path = "../ferridis-adapter-fs", version = "0.7.0" }
axum = { workspace = true }
