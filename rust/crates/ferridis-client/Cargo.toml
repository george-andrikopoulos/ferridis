[package]
name = "ferridis-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Consumer-side library for the Ferridis protocol: wallet, manifest cache, intent resolver, dispatch. Used by IDE extensions and embedding hosts."

[dependencies]
ferridis-core = { workspace = true }
ferridis-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
url = { workspace = true }

tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
keyring = { workspace = true }
jsonschema = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
ferridis-adapter-sdk = { workspace = true }
ferridis-adapter-fs = { path = "../ferridis-adapter-fs", version = "0.7.0" }
axum = { workspace = true }
base64 = { workspace = true }
sigstore = { workspace = true }

[[example]]
name = "ha_via_ferridis"
path = "examples/ha_via_ferridis.rs"
