<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-t">
  <title id="rm-t">Ferridis v0.7 at a glance: programmatic tool calling as the headline, plus the additive protocol changes, shared host plumbing in ferridis-client, streaming backpressure and cancellation, response schemas from every reference adapter, cross-platform quality work, and VS Code connecting to a running Ferridis service.</title>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', monospace; }
      .h { font-size: 12px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 10px; fill: #64748B; }
      .b { font-size: 10px; fill: #334155; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .tag { font-size: 8.5px; font-weight: 700; letter-spacing: 0.5px; }
    </style>
  </defs>
  <rect width="820" height="550" fill="#F8FAFC"/>

  <text x="24" y="32" class="sans" font-size="15" font-weight="700" fill="#0F172A">Ferridis v0.7: what changed since v0.6</text>
  <text x="24" y="50" class="sans sub">13 commits · 144 files · +11.2K / −2.5K lines · 449 Rust tests on Ubuntu and Windows CI, plus 11 VS Code extension tests</text>

  <!-- ===== Headline ===== -->
  <rect x="24" y="66" width="772" height="94" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="40" y="80" width="40" height="16" rx="8" fill="#16A34A"/>
  <text x="60" y="91" text-anchor="middle" class="sans tag" fill="#FFFFFF">NEW</text>
  <text x="88" y="93" class="sans" font-size="14" font-weight="700" fill="#14532D">Ferridis now supports programmatic tool calling</text>
  <text x="440" y="93" class="mono" font-size="11" fill="#15803D">ferridis-ptc</text>
  <text x="40" y="116" class="sans b">Claude writes code that calls Ferridis tools from its code-execution container. Each tool is direct-only or</text>
  <text x="40" y="131" class="sans b">code-only, enforced at the gateway in both directions. Retries, result caps and per-call deadlines included.</text>
  <text x="40" y="148" class="sans" font-size="10" font-weight="700" fill="#15803D">Verified live 2026-10-26: 5 turns, 4 calls from code, correct answer, about $0.05.</text>

  <!-- ===== Row 1 ===== -->
  <!-- Protocol -->
  <rect x="24" y="176" width="252" height="134" rx="10" class="card"/>
  <rect x="40" y="190" width="62" height="16" rx="8" fill="#DBEAFE"/>
  <text x="71" y="201" text-anchor="middle" class="sans tag" fill="#1D4ED8">PROTOCOL</text>
  <text x="40" y="226" class="sans h">Additive wire changes</text>
  <text x="40" y="246" class="sans b">• manifest intents may declare</text>
  <text x="52" y="260" class="mono" font-size="9.5" fill="#334155">"callers": "direct" | "code"</text>
  <text x="40" y="278" class="sans b">• SSE streams may carry</text>
  <text x="52" y="292" class="mono" font-size="9.5" fill="#334155">event: backpressure</text>

  <!-- Client -->
  <rect x="284" y="176" width="252" height="134" rx="10" class="card"/>
  <rect x="300" y="190" width="48" height="16" rx="8" fill="#EDE9FE"/>
  <text x="324" y="201" text-anchor="middle" class="sans tag" fill="#6D28D9">CLIENT</text>
  <text x="300" y="226" class="sans h">One host path for every host</text>
  <text x="300" y="246" class="sans b">• tool catalogue and adapters.json</text>
  <text x="312" y="260" class="sans b">loading now live in ferridis-client</text>
  <text x="300" y="278" class="sans b">• per-tool caller overrides</text>
  <text x="300" y="296" class="sans b">• tier-used log names the caller</text>

  <!-- Streaming -->
  <rect x="544" y="176" width="252" height="134" rx="10" class="card"/>
  <rect x="560" y="190" width="70" height="16" rx="8" fill="#FEF3C7"/>
  <text x="595" y="201" text-anchor="middle" class="sans tag" fill="#B45309">STREAMING</text>
  <text x="560" y="226" class="sans h">Backpressure, wired end to end</text>
  <text x="560" y="246" class="sans b">• adapters can signal slow-down or halt</text>
  <text x="560" y="264" class="sans b">• a halt reaches the client as a</text>
  <text x="572" y="278" class="sans b">typed error and ends the stream</text>
  <text x="560" y="296" class="sans b">• dropping a stream stops the adapter</text>

  <!-- ===== Row 2 ===== -->
  <!-- Adapters -->
  <rect x="24" y="326" width="252" height="134" rx="10" class="card"/>
  <rect x="40" y="340" width="62" height="16" rx="8" fill="#FCE7F3"/>
  <text x="71" y="351" text-anchor="middle" class="sans tag" fill="#BE185D">ADAPTERS</text>
  <text x="40" y="376" class="sans h">Response schemas, served</text>
  <text x="40" y="396" class="sans b">• all six reference adapters serve</text>
  <text x="52" y="410" class="sans b">OpenAPI 3 with response schemas</text>
  <text x="40" y="428" class="sans b">• live responses checked against them</text>
  <text x="40" y="446" class="sans b">• tool descriptions carry them</text>

  <!-- Quality -->
  <rect x="284" y="326" width="252" height="134" rx="10" class="card"/>
  <rect x="300" y="340" width="56" height="16" rx="8" fill="#E2E8F0"/>
  <text x="328" y="351" text-anchor="middle" class="sans tag" fill="#334155">QUALITY</text>
  <text x="300" y="376" class="sans h">Proved on two platforms</text>
  <text x="300" y="396" class="sans b">• CI on Ubuntu and Windows</text>
  <text x="300" y="414" class="sans b">• first property tests in the workspace</text>
  <text x="300" y="432" class="sans b">• stdio bridge: 0 → 11 tests</text>
  <text x="300" y="450" class="sans b">• 40 tests closing FEATURES.md gaps</text>

  <!-- Compatibility -->
  <rect x="544" y="326" width="252" height="134" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="560" y="340" width="96" height="16" rx="8" fill="#DCFCE7"/>
  <text x="608" y="351" text-anchor="middle" class="sans tag" fill="#15803D">COMPATIBILITY</text>
  <text x="560" y="376" class="sans h">Nothing to migrate</text>
  <text x="560" y="396" class="sans b">• v0.6 manifests parse unchanged</text>
  <text x="560" y="414" class="sans b">• bare-array adapters.json still loads</text>
  <text x="560" y="432" class="sans b">• older clients ignore the new</text>
  <text x="572" y="446" class="sans b">backpressure event</text>
  <!-- ===== Row 3: editors ===== -->
  <rect x="24" y="476" width="772" height="58" rx="10" class="card"/>
  <rect x="40" y="490" width="58" height="16" rx="8" fill="#E0F2FE"/>
  <text x="69" y="501" text-anchor="middle" class="sans tag" fill="#0369A1">EDITORS</text>
  <text x="110" y="502" class="sans h">VS Code joins a running Ferridis service</text>
  <text x="40" y="522" class="sans b">Extension v0.3: <tspan class="mono" font-size="9.5">ferridis.serverUrl</tspan> connects to <tspan class="mono" font-size="9.5">ferridis-mcp-server --http-bind</tspan> over Streamable HTTP; bearer token in VS Code secret storage.</text>
</svg>
